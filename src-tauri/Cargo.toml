[package]
name = "absensi_sppg_desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "absensi_sppg_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
dotenvy = "0.15.7"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-stronghold = "2.3.1"
reqwest = { version = "0.13.4", features = ["json", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10.9"
hex = "0.4.3"
url = "2.5.7"
zeroize = "1.8.2"
base64 = "0.22"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
argon2 = "0.5.3"
aes-gcm = "0.10.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.dev.package.scrypt]
opt-level = 3
